<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="100%" height="100%">
  <defs>
    <linearGradient id="snPearl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff1e8"/>
      <stop offset="100%" stop-color="#e8d8cc"/>
    </linearGradient>
    <linearGradient id="snGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff580"/>
      <stop offset="35%" stop-color="#ffec27"/>
      <stop offset="70%" stop-color="#ffa300"/>
      <stop offset="100%" stop-color="#d48000"/>
    </linearGradient>
    <linearGradient id="snSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3a60"/>
      <stop offset="50%" stop-color="#1d2b53"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="snLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29adff"/>
      <stop offset="70%" stop-color="#00e436"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </linearGradient>
    <filter id="snShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#snShadow)">
    <!-- Precision Competition Buttstock with Adjustable Cheek Comb -->
    <path d="M 40,86 L 140,86 L 160,118 L 130,136 L 40,146 Z" fill="url(#snPearl)" stroke="#d48000" stroke-width="2"/>
    <!-- Recoil Buttpad -->
    <rect x="30" y="84" width="12" height="64" rx="3" fill="#5f574f" stroke="#36322d" stroke-width="2"/>
    <!-- Gold Adjustable Comb / Cheek-piece -->
    <path d="M 64,68 L 130,68 Q 140,68 136,86 L 68,86 Z" fill="url(#snGold)" stroke="#b36b00" stroke-width="2"/>
    <circle cx="94" cy="77" r="3" fill="#fff"/>
    <circle cx="112" cy="77" r="3" fill="#fff"/>

    <!-- Ivory Rifle Receiver Body -->
    <rect x="150" y="84" width="220" height="42" rx="4" fill="url(#snPearl)" stroke="#bfa694" stroke-width="2.5"/>
    <!-- 24K Gold Trim Line Along Chassis -->
    <rect x="150" y="98" width="220" height="7" fill="url(#snGold)"/>
    <circle cx="170" cy="112" r="3" fill="#ffa300"/>
    <circle cx="190" cy="112" r="3" fill="#ffa300"/>

    <!-- Gold Bolt Assembly & Turned Bolt Knob -->
    <rect x="230" y="80" width="60" height="9" rx="2" fill="url(#snGold)" stroke="#b36b00" stroke-width="1.5"/>
    <path d="M 284,82 L 306,94 L 302,100 L 282,88 Z" fill="url(#snGold)" stroke="#b36b00" stroke-width="1.5"/>
    <circle cx="310" cy="98" r="7" fill="url(#snGold)" stroke="#b36b00" stroke-width="2"/>

    <!-- Ergonomic Vertical Sniper Grip -->
    <path d="M 166,126 L 152,188 L 184,192 L 198,126 Z" fill="url(#snSteel)" stroke="#0e172a" stroke-width="2.5"/>
    <rect x="156" y="142" width="28" height="3" rx="1.5" fill="#ffa300"/>
    <rect x="154" y="156" width="28" height="3" rx="1.5" fill="#ffa300"/>
    <rect x="152" y="170" width="28" height="3" rx="1.5" fill="#ffa300"/>

    <!-- Trigger Guard & Fine Target Trigger -->
    <path d="M 194,126 C 194,146 226,146 226,126" fill="none" stroke="#5f574f" stroke-width="3"/>
    <path d="M 208,128 Q 206,136 202,140" fill="none" stroke="url(#snGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Internal Box Magazine Baseplate -->
    <rect x="238" y="126" width="56" height="12" rx="2" fill="url(#snSteel)" stroke="#ffa300" stroke-width="1.5"/>

    <!-- Long Match-Grade Free-Floating Fluted Barrel -->
    <rect x="368" y="94" width="310" height="18" fill="url(#snSteel)" stroke="#0e172a" stroke-width="2"/>
    <!-- Longitudinal Fluting Grooves -->
    <line x1="380" y1="99" x2="660" y2="99" stroke="#3d4f7c" stroke-width="2"/>
    <line x1="380" y1="106" x2="660" y2="106" stroke="#3d4f7c" stroke-width="2"/>

    <!-- Heavy Multi-Port Tactical Muzzle Brake -->
    <rect x="678" y="86" width="56" height="34" rx="3" fill="#5f574f" stroke="#36322d" stroke-width="2.5"/>
    <!-- Muzzle brake side baffles/ports -->
    <rect x="686" y="90" width="8" height="26" rx="2" fill="#1d2b53"/>
    <rect x="702" y="90" width="8" height="26" rx="2" fill="#1d2b53"/>
    <rect x="718" y="90" width="8" height="26" rx="2" fill="#1d2b53"/>
    <!-- 24K Gold Barrel Crown -->
    <rect x="734" y="90" width="16" height="26" rx="2" fill="url(#snGold)" stroke="#b36b00" stroke-width="2"/>

    <!-- HIGH-POWER TACTICAL SNIPER OPTIC / SCOPE -->
    <!-- Scope Mount Cantilever Base & Dual Rings -->
    <rect x="210" y="78" width="144" height="7" rx="1.5" fill="#5f574f"/>
    <rect x="224" y="58" width="16" height="22" rx="2" fill="url(#snSteel)" stroke="#ffa300" stroke-width="1.5"/>
    <rect x="320" y="58" width="16" height="22" rx="2" fill="url(#snSteel)" stroke="#ffa300" stroke-width="1.5"/>

    <!-- Main Scope Tube (34mm) -->
    <rect x="180" y="56" width="200" height="18" rx="2" fill="url(#snSteel)" stroke="#0a1222" stroke-width="2"/>

    <!-- Elevation & Windage Turrets (Knurled Gold) -->
    <rect x="272" y="38" width="18" height="18" rx="2" fill="url(#snGold)" stroke="#b36b00" stroke-width="1.5"/>
    <line x1="274" y1="44" x2="288" y2="44" stroke="#d48000" stroke-width="1.5"/>
    <line x1="274" y1="50" x2="288" y2="50" stroke="#d48000" stroke-width="1.5"/>

    <!-- Eyepiece / Ocular Bell -->
    <path d="M 180,54 L 152,48 L 152,82 L 180,76 Z" fill="url(#snSteel)" stroke="#0a1222" stroke-width="2"/>
    <rect x="146" y="47" width="8" height="36" rx="2" fill="#1b1b1b"/>

    <!-- Objective Bell & Sunshade -->
    <path d="M 378,56 L 416,42 L 444,42 L 444,88 L 416,88 L 378,74 Z" fill="url(#snSteel)" stroke="#0a1222" stroke-width="2"/>
    <!-- Gold Optic Ring -->
    <rect x="442" y="42" width="6" height="46" fill="url(#snGold)"/>
    <!-- Anti-Reflective Multicoated Cyan Glass Lens -->
    <ellipse cx="448" cy="65" rx="5" ry="21" fill="url(#snLens)" stroke="#fff" stroke-width="1"/>
    <!-- Lens Reflection Glint -->
    <path d="M 447,52 Q 449,60 447,72" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
