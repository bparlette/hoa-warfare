<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pistolSlide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d6d7dc"/>
      <stop offset="70%" stop-color="#b0b2b8"/>
      <stop offset="100%" stop-color="#8e9096"/>
    </linearGradient>
    <linearGradient id="pistolFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b3a42"/>
      <stop offset="50%" stop-color="#292831"/>
      <stop offset="100%" stop-color="#19181f"/>
    </linearGradient>
    <linearGradient id="pistolWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#693b4f"/>
      <stop offset="50%" stop-color="#492434"/>
      <stop offset="100%" stop-color="#2e1420"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#pShadow)">
    <!-- Black Polymer Lower Frame -->
    <path d="M 120,96 L 310,96 L 310,126 L 254,128 L 226,146 L 194,146 L 180,224 L 126,220 L 140,132 L 120,118 Z" fill="url(#pistolFrame)" stroke="#111014" stroke-width="2.5"/>

    <!-- Accessory Picatinny Rail on Dust Cover -->
    <rect x="250" y="122" width="56" height="6" fill="#19181f"/>
    <line x1="262" y1="122" x2="262" y2="128" stroke="#3b3a42" stroke-width="2"/>
    <line x1="278" y1="122" x2="278" y2="128" stroke="#3b3a42" stroke-width="2"/>
    <line x1="294" y1="122" x2="294" y2="128" stroke="#3b3a42" stroke-width="2"/>

    <!-- Ergonomic Rosewood / Checkered Grip Inlay Panel -->
    <path d="M 144,142 L 182,150 L 170,214 L 134,210 Z" fill="url(#pistolWood)" stroke="#2e1420" stroke-width="2"/>
    <!-- Diamond checkering texture -->
    <line x1="148" y1="154" x2="174" y2="194" stroke="#ff77a8" stroke-width="1.2" opacity="0.4"/>
    <line x1="142" y1="172" x2="166" y2="210" stroke="#ff77a8" stroke-width="1.2" opacity="0.4"/>
    <line x1="172" y1="156" x2="142" y2="196" stroke="#ff77a8" stroke-width="1.2" opacity="0.4"/>
    <line x1="180" y1="174" x2="152" y2="212" stroke="#ff77a8" stroke-width="1.2" opacity="0.4"/>
    <!-- Grip medallions / screws -->
    <circle cx="158" cy="158" r="3" fill="#ffec27" stroke="#ffa300"/>
    <circle cx="150" cy="198" r="3" fill="#ffec27" stroke="#ffa300"/>

    <!-- Flared Extended Magazine Basepad -->
    <rect x="118" y="218" width="70" height="14" rx="3" fill="#19181f" stroke="#000" stroke-width="2"/>

    <!-- Undercut Trigger Guard & Match Skeleton Trigger -->
    <path d="M 188,142 C 188,174 246,174 248,138" fill="none" stroke="#292831" stroke-width="3.5"/>
    <path d="M 214,142 Q 212,154 206,160" fill="none" stroke="#c2c3c7" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="210" cy="150" r="1.5" fill="#19181f"/>

    <!-- Stainless Steel Silver Slide -->
    <rect x="108" y="56" width="228" height="42" rx="3" fill="url(#pistolSlide)" stroke="#73757a" stroke-width="2.5"/>
    
    <!-- Ejection Port & Steel Barrel Hood -->
    <rect x="206" y="56" width="46" height="18" rx="1.5" fill="#1d2b53" stroke="#0e172a" stroke-width="1.5"/>
    <text x="212" y="68" font-family="monospace" font-size="7" fill="#ffec27" font-weight="bold">9x19 HOA</text>

    <!-- Slide Cocking Serrations (Rear & Front) -->
    <!-- Rear Serrations -->
    <rect x="116" y="62" width="4" height="28" rx="1" fill="#83769c"/>
    <rect x="124" y="62" width="4" height="28" rx="1" fill="#83769c"/>
    <rect x="132" y="62" width="4" height="28" rx="1" fill="#83769c"/>
    <rect x="140" y="62" width="4" height="28" rx="1" fill="#83769c"/>
    <rect x="148" y="62" width="4" height="28" rx="1" fill="#83769c"/>

    <!-- Front Serrations -->
    <rect x="274" y="66" width="3.5" height="22" rx="1" fill="#83769c"/>
    <rect x="282" y="66" width="3.5" height="22" rx="1" fill="#83769c"/>
    <rect x="290" y="66" width="3.5" height="22" rx="1" fill="#83769c"/>

    <!-- Tactical Combat Sights -->
    <!-- Rear Sight Notch -->
    <path d="M 112,56 L 112,46 L 126,46 L 126,56 Z" fill="#1d2b53"/>
    <!-- High-Vis Fiber-Optic Front Sight (Neon Red) -->
    <rect x="316" y="48" width="14" height="8" rx="1" fill="#1d2b53"/>
    <rect x="318" y="50" width="10" height="4" rx="2" fill="#ff004d"/>
    <circle cx="328" cy="52" r="2" fill="#ff77a8"/>

    <!-- Slide Release Lever & Takedown Pin -->
    <rect x="194" y="98" width="18" height="6" rx="2" fill="#5f574f"/>
    <rect x="228" y="100" width="12" height="6" rx="1.5" fill="#5f574f"/>
    <!-- Beavertail & Hammer -->
    <path d="M 108,86 Q 96,88 94,80 Q 106,78 108,86" fill="#292831"/>
  </g>
</svg>
