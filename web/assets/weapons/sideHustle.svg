<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="smgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b36b"/>
      <stop offset="50%" stop-color="#008751"/>
      <stop offset="100%" stop-color="#005936"/>
    </linearGradient>
    <linearGradient id="smgMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c96645"/>
      <stop offset="100%" stop-color="#8f391f"/>
    </linearGradient>
    <linearGradient id="smgComp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e436"/>
      <stop offset="50%" stop-color="#a8e72e"/>
      <stop offset="100%" stop-color="#00c72c"/>
    </linearGradient>
    <linearGradient id="smgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3a60"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <filter id="smgShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#smgShadow)">
    <!-- Collapsible Wire Stock -->
    <rect x="42" y="74" width="90" height="7" rx="2" fill="#5f574f" stroke="#36322d" stroke-width="1.5"/>
    <rect x="42" y="92" width="90" height="7" rx="2" fill="#5f574f" stroke="#36322d" stroke-width="1.5"/>
    <path d="M 32,60 L 46,60 L 46,110 L 32,110 Z" fill="#1d2b53" stroke="#0e172a" stroke-width="2"/>
    <rect x="28" y="58" width="6" height="56" rx="2" fill="#5f574f"/>

    <!-- Main Receiver -->
    <rect x="126" y="62" width="220" height="52" rx="5" fill="url(#smgGreen)" stroke="#004d2e" stroke-width="2.5"/>
    <!-- Receiver detail cutouts / bolts -->
    <rect x="146" y="70" width="34" height="12" rx="2" fill="#004d2e"/>
    <rect x="194" y="74" width="8" height="8" rx="2" fill="#ffa300"/>
    <line x1="220" y1="88" x2="330" y2="88" stroke="#004d2e" stroke-width="3"/>

    <!-- Top Rail / Optics Mount -->
    <rect x="136" y="50" width="190" height="13" rx="2" fill="#125359" stroke="#092d30" stroke-width="2"/>
    <rect x="170" y="44" width="50" height="8" rx="2" fill="#c2c3c7"/>
    <!-- Rail notches -->
    <line x1="146" y1="50" x2="146" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="160" y1="50" x2="160" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="230" y1="50" x2="230" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="244" y1="50" x2="244" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="258" y1="50" x2="258" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="272" y1="50" x2="272" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="286" y1="50" x2="286" y2="63" stroke="#092d30" stroke-width="2"/>
    <line x1="300" y1="50" x2="300" y2="63" stroke="#092d30" stroke-width="2"/>

    <!-- Tactical Pistol Grip -->
    <path d="M 148,114 L 126,188 L 160,192 L 180,114 Z" fill="url(#smgDark)" stroke="#0e172a" stroke-width="2.5"/>
    <line x1="138" y1="138" x2="164" y2="142" stroke="#2a3a60" stroke-width="2"/>
    <line x1="135" y1="152" x2="160" y2="156" stroke="#2a3a60" stroke-width="2"/>
    <line x1="131" y1="166" x2="155" y2="170" stroke="#2a3a60" stroke-width="2"/>

    <!-- Trigger Guard & Trigger -->
    <path d="M 176,114 C 176,134 204,134 204,114" fill="none" stroke="#5f574f" stroke-width="3"/>
    <path d="M 190,116 Q 188,124 184,128" fill="none" stroke="#ffa300" stroke-width="3" stroke-linecap="round"/>

    <!-- Forward Extended Stick Magazine (Angled) -->
    <g transform="translate(254, 110) rotate(-14)">
      <rect x="-14" y="0" width="30" height="96" rx="3" fill="url(#smgMag)" stroke="#662613" stroke-width="2.5"/>
      <!-- Ribs -->
      <line x1="-12" y1="20" x2="14" y2="20" stroke="#ffec27" stroke-width="2" opacity="0.6"/>
      <line x1="-12" y1="36" x2="14" y2="36" stroke="#ffec27" stroke-width="2" opacity="0.6"/>
      <line x1="-12" y1="52" x2="14" y2="52" stroke="#ffec27" stroke-width="2" opacity="0.6"/>
      <line x1="-12" y1="68" x2="14" y2="68" stroke="#ffec27" stroke-width="2" opacity="0.6"/>
      <!-- High-Vis Base Bumper -->
      <rect x="-16" y="92" width="34" height="15" rx="3" fill="#ffa300" stroke="#cc8200" stroke-width="2"/>
    </g>

    <!-- Stubby Barrel -->
    <rect x="344" y="76" width="46" height="20" fill="#5f574f" stroke="#36322d" stroke-width="2"/>

    <!-- Multi-Port Toxic Green Compensator -->
    <rect x="388" y="68" width="54" height="36" rx="4" fill="url(#smgComp)" stroke="#008a1c" stroke-width="2.5"/>
    <!-- Top compensator ports -->
    <rect x="398" y="64" width="8" height="6" fill="#141c2e"/>
    <rect x="414" y="64" width="8" height="6" fill="#141c2e"/>
    <rect x="430" y="64" width="8" height="6" fill="#141c2e"/>
    <!-- Side venting slots -->
    <rect x="396" y="80" width="10" height="12" rx="2" fill="#141c2e"/>
    <rect x="412" y="80" width="10" height="12" rx="2" fill="#141c2e"/>
    <rect x="428" y="80" width="10" height="12" rx="2" fill="#141c2e"/>
    <!-- Toxic lime crown tip -->
    <rect x="442" y="72" width="14" height="28" rx="2" fill="#a8e72e" stroke="#00c72c" stroke-width="2"/>
  </g>
</svg>
