          echo "listed paths: $(wc -l < /tmp/del.txt)"

          # 3. Keep only paths present at the tip; report anything missing
          gh api "repos/${REPO}/git/trees/${TREE}?recursive=1" --jq '.tree[] | select(.type=="blob") | .path' | sort > /tmp/all.txt
          sort -u /tmp/del.txt > /tmp/want.txt
          comm -23 /tmp/want.txt /tmp/all.txt > /tmp/missing.txt || true
          echo "missing at tip: $(wc -l < /tmp/missing.txt)"
          cat /tmp/missing.txt || true
          comm -12 /tmp/want.txt /tmp/all.txt > /tmp/go.txt
          GO=$(wc -l < /tmp/go.txt)
          echo "paths to delete: ${GO}"
          test "${GO}" -gt 0

          # 4. New tree on base_tree with deletion entries (sha null deletes)
          jq -R -s --arg bt "${TREE}" '
            split("\n") | map(select(length > 0))
            | {base_tree: $bt, tree: [.[] | {path: ., mode: "100644", type: "blob", sha: null}]}
          ' /tmp/go.txt > /tmp/tree.json
          NEW_TREE=$(gh api "repos/${REPO}/git/trees" --method POST --input /tmp/tree.json --jq .sha)
          echo "new tree: ${NEW_TREE}"

          # 5. One commit with the new tree, parent = previous main tip
          jq -n --arg t "${NEW_TREE}" --arg p "${TIP}" '{
            message: "Remove 286 orphan voice lines (archived to Hawk voice-library)",
            tree: $t,
            parents: [$p]
          }' > /tmp/commit.json
          NEW_COMMIT=$(gh api "repos/${REPO}/git/commits" --method POST --input /tmp/commit.json --jq .sha)
          echo "new commit: ${NEW_COMMIT}"

          # 6. Point refs/heads/main at the new commit
          jq -n --arg s "${NEW_COMMIT}" '{sha: $s}' > /tmp/ref.json
          RESULT=$(gh api "repos/${REPO}/git/refs/heads/main" --method PATCH --input /tmp/ref.json --jq .object.sha)
          echo "main now points to: ${RESULT}"
          test "${RESULT}" = "${NEW_COMMIT}"
          echo "DONE"
